name: GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ashutosh00710/github-readme-activity-graph@0962e9461de815933d462e8b98c7ce566cada8fb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_filename: profile-activity-graph.svg
          theme: nightowl
